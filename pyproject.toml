[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperscale-emissions"
version = "0.3.0"
description = "Reproducibility code for attributional CO2 emissions of US hyperscale data centers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Gianluca Guidi"}
]
dependencies = [
    "scikit-learn==1.9.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbformat>=5.0"]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyproj>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
