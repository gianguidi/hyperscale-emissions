[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperscale-emissions"
version = "0.2.0"
description = "Reproducibility code for hyperscale data center emissions analysis"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj",
  "fiona",
  "openpyxl",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
