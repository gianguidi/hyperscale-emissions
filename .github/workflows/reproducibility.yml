name: reproducibility

on:
  push:
  pull_request:

jobs:
  public-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pip install pytest
      - run: python scripts/check_no_restricted_data.py
      - run: python scripts/make_synthetic_403_fixture.py
      - run: pytest -q
      - run: python scripts/reproduce_model.py
      - run: python scripts/validate_public_exports.py
