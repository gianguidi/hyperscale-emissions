name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - round3-total-output-update

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run Round 3 smoke test
        run: python scripts/smoke_test_repository.py

      - name: Check manuscript outputs
        run: python scripts/check_paper_outputs.py
